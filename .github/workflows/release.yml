# Pushing a tag like v0.1.0 builds the .deb and .rpm, publishes them as a
# GitHub Release and updates the download page on GitHub Pages.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    # The oldest supported Ubuntu, so the packages work on older glibc too.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app version
        id: version
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión $version de tauri.conf.json"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build packages
        run: npx tauri build --bundles deb,rpm

      - name: Collect packages
        run: |
          mkdir dist-packages
          cp src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/rpm/*.rpm dist-packages/
          (cd dist-packages && sha256sum * > SHA256SUMS)
          ls -l dist-packages

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist-packages

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist-packages

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-packages/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Runux ${{ needs.build.outputs.version }}" \
            --generate-notes

  pages:
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist-packages

      - name: Render the download page
        run: |
          python3 site/render.py "${{ needs.build.outputs.version }}" \
            dist-packages/*.deb dist-packages/*.rpm \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            public-site

      - name: Build the APT and DNF repositories
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils createrepo-c
          echo "$REPO_SIGNING_KEY" | gpg --batch --import
          site/repos.sh dist-packages/*.deb dist-packages/*.rpm public-site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public-site

      - id: deploy
        uses: actions/deploy-pages@v5
