# On every push to main and every pull request: the frontend builds, the Rust
# tests pass and the TypeScript bindings they generate are up to date.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Type-checks and builds the frontend, which the Rust build embeds.
      - run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Check the TypeScript bindings are up to date
        run: |
          if [ -n "$(git status --porcelain src/bindings)" ]; then
            git status --short src/bindings
            echo "::error::src/bindings no coincide con los tipos de Rust: ejecuta cargo test y haz commit de src/bindings"
            exit 1
          fi
