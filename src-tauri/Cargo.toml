[package]
name = "runux"
version = "0.1.25"
description = "Lanzador de juegos de Windows para Linux: Battle.net, EA app y más"
authors = ["Agustín García <contacto@agustin-garcia.es>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "runux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
tokio = { version = "1", features = ["process", "io-util", "fs", "macros", "rt-multi-thread", "sync", "time"] }
futures-util = "0.3"
dirs = "6"
flate2 = "1"
tar = "0.4"
xz2 = { version = "0.1", features = ["static"] }
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-dialog = "2"
ts-rs = "12"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
